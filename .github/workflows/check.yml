name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm run check` is offline by design (module exports + manifest + bundle
      # patch), so no `npm install` / lockfile is required.
      - name: Offline plugin checks
        run: npm run check
